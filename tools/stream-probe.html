(async()=>{try{await tf.setBackend('cpu');await tf.ready();tflite.setWasmPath('../vendor/');const model=await tflite.loadTFLiteModel('../assets/models/onsets_frames_wavinput_uni.tflite',{numThreads:1});const audio=new Float32Array(await(await fetch('fixtures/audio.f32')).arrayBuffer()),expected=await(await fetch('fixtures/expected.json')).json(),stream=new ScoreFollowCore.PianoStream(model,44100),notes=[],cost=[];for(let offset=0;offset+1024<=audio.length;offset+=1024){let start=performance.now(),frames=stream.accept(audio.subarray(offset,offset+1024));if(frames.length)cost.push(performance.now()-start);for(const n of frames)n.attacks.forEach((p,i)=>{if(p>=.5)notes.push([n.onsetTimeMs,i]);});}window.result={status:'ready',notes:notes.length,expected:expected.length,equal:JSON.stringify(notes)===JSON.stringify(expected),meanInferenceMs:cost.reduce((a,b)=>a+b,0)/cost.length,maxInferenceMs:Math.max(...cost),tensorCount:tf.memory().numTensors,first:notes.slice(0,6)};}catch(e){window.result={status:'error',message:String(e),stack:e.stack}}})();</script>
