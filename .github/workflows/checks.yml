name: Web checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - name: Check phone, tablet and desktop UI
        run: |
          mkdir -p shots
          python3 serve.py --port 8767 > /tmp/piano-web-server.log 2>&1 &
          curl --retry 8 --retry-connrefused --retry-delay 1 http://127.0.0.1:8767/ -o /dev/null
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ui-evidence
          path: shots/
